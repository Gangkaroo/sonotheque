services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: sonotheque-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonotheque}
      POSTGRES_USER: ${POSTGRES_USER:-sonotheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonotheque}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18-data:/var/lib/postgresql

volumes:
  postgres18-data:
