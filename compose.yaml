services:
  postgres:
    image: postgres:18-alpine
    container_name: music-library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_library}
      POSTGRES_USER: ${POSTGRES_USER:-music_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_library}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18-data:/var/lib/postgresql

volumes:
  postgres18-data:
