name: sonotheque-packaged

x-backend-environment: &backend-environment
  APP_NAME: Sonotheque
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://127.0.0.1:8080}
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-sonotheque}
  DB_USERNAME: ${POSTGRES_USER:-sonotheque}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-sonotheque}
  DB_SSLMODE: disable
  CACHE_STORE: ${CACHE_STORE:-file}
  CACHE_SERIALIZABLE_CLASSES: ${CACHE_SERIALIZABLE_CLASSES:-true}
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "86400"
  FILESYSTEM_DISK: local
  SONOTHEQUE_LAN_ENABLED: ${SONOTHEQUE_LAN_ENABLED:-false}
  SONOTHEQUE_LOCAL_PROXY_ENABLED: ${SONOTHEQUE_LOCAL_PROXY_ENABLED:-true}
  SONOTHEQUE_ADMIN_TOKEN: ${SONOTHEQUE_ADMIN_TOKEN:-}
  SONOTHEQUE_TRUSTED_HOSTS: ${SONOTHEQUE_TRUSTED_HOSTS:-localhost,127.0.0.1,::1}
  SONOTHEQUE_ALLOWED_ORIGINS: ${SONOTHEQUE_ALLOWED_ORIGINS:-}
  LASTFM_API_URL: ${LASTFM_API_URL:-https://ws.audioscrobbler.com/2.0/}
  LASTFM_AUTH_URL: ${LASTFM_AUTH_URL:-https://www.last.fm/api/auth/}
  DISCOGS_API_URL: ${DISCOGS_API_URL:-https://api.discogs.com}
  DISCOGS_WEB_URL: ${DISCOGS_WEB_URL:-https://www.discogs.com}
  DISCOGS_USER_AGENT: ${DISCOGS_USER_AGENT:-Sonotheque/0.1 (https://github.com/Gangkaroo/sonotheque)}
  LRCLIB_API_URL: ${LRCLIB_API_URL:-https://lrclib.net/api}
  MUSICBRAINZ_API_URL: ${MUSICBRAINZ_API_URL:-https://musicbrainz.org/ws/2}
  MUSICBRAINZ_WEB_URL: ${MUSICBRAINZ_WEB_URL:-https://musicbrainz.org}
  AUDIO_INTELLIGENCE_DRIVER: ${AUDIO_INTELLIGENCE_DRIVER:-none}
  AUDIO_INTELLIGENCE_MODEL_PATH: /audio-intelligence-model/${AUDIO_INTELLIGENCE_MODEL_FILENAME:-model.pb}
  AUDIO_INTELLIGENCE_DOCKER_IMAGE: ${AUDIO_INTELLIGENCE_DOCKER_IMAGE:-sonotheque-audio-intelligence:analysis}
  AUDIO_INTELLIGENCE_BENCHMARK_CPU_IMAGE: ${AUDIO_INTELLIGENCE_BENCHMARK_CPU_IMAGE:-sonotheque-audio-intelligence:analysis}
  AUDIO_INTELLIGENCE_BENCHMARK_CUDA_IMAGE: ${AUDIO_INTELLIGENCE_BENCHMARK_CUDA_IMAGE:-sonotheque-audio-intelligence:cuda}
  AUDIO_INTELLIGENCE_ACCELERATOR: ${AUDIO_INTELLIGENCE_ACCELERATOR:-cpu}
  AUDIO_INTELLIGENCE_PERSISTENT: ${AUDIO_INTELLIGENCE_PERSISTENT:-true}
  AUDIO_INTELLIGENCE_MOUNT_SOURCE_CONTAINER: ${AUDIO_INTELLIGENCE_MOUNT_SOURCE_CONTAINER:-self}
  AUDIO_INTELLIGENCE_HEALTH_VIA_QUEUE: ${AUDIO_INTELLIGENCE_HEALTH_VIA_QUEUE:-true}
  AUDIO_INTELLIGENCE_CONTAINER_NAME: sonotheque-packaged-audio-analyzer
  SONOTHEQUE_HOST_UID: ${SONOTHEQUE_HOST_UID:-}
  SONOTHEQUE_HOST_GID: ${SONOTHEQUE_HOST_GID:-}

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile.packaged
  environment: *backend-environment
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - backend-storage:/app/storage
    - type: bind
      source: ${SONOTHEQUE_BACKUP_DIRECTORY:-./backups}
      target: /backups
    - type: bind
      source: ${SONOTHEQUE_ROOT_1:-./packaged/music-root-1}
      target: /music/root-1
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonotheque}
      POSTGRES_USER: ${POSTGRES_USER:-sonotheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonotheque}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18-packaged-cluster-data:/var/lib/postgresql

  migrate:
    <<: *backend-image
    environment:
      <<: *backend-environment
      API_PLATFORM_RESOURCES_ENABLED: "false"
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  backend:
    <<: *backend-image
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 12

  queue-default:
    <<: *backend-image
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=1", "--timeout=0", "--memory=512", "--sleep=1"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  queue-scans:
    <<: *backend-image
    command: ["php", "artisan", "queue:work", "--queue=scans", "--tries=1", "--timeout=0", "--memory=512", "--sleep=1"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  queue-analysis:
    <<: *backend-image
    command: ["php", "artisan", "queue:work", "--queue=analysis", "--tries=1", "--timeout=0", "--memory=512", "--sleep=1"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  queue-analysis-ai:
    <<: *backend-image
    profiles: ["audio-intelligence"]
    command: ["php", "artisan", "queue:work", "--queue=analysis-control,analysis", "--tries=1", "--timeout=0", "--memory=512", "--sleep=1"]
    restart: unless-stopped
    group_add:
      - "${SONOTHEQUE_DOCKER_GID:-0}"
    volumes:
      - backend-storage:/app/storage
      - type: bind
        source: ${SONOTHEQUE_ROOT_1:-./packaged/music-root-1}
        target: /music/root-1
        read_only: true
      - type: bind
        source: ${AUDIO_INTELLIGENCE_MODEL_DIRECTORY:-./packaged/audio-intelligence}
        target: /audio-intelligence-model
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-image
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.packaged
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres18-packaged-cluster-data:
  backend-storage:
