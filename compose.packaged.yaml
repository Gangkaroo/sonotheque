name: music-library-packaged

x-backend-environment: &backend-environment
  APP_NAME: Music Library
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://127.0.0.1:8080}
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-music_library}
  DB_USERNAME: ${POSTGRES_USER:-music_library}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-music_library}
  DB_SSLMODE: disable
  CACHE_STORE: ${CACHE_STORE:-file}
  CACHE_SERIALIZABLE_CLASSES: ${CACHE_SERIALIZABLE_CLASSES:-true}
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "86400"
  FILESYSTEM_DISK: local
  MUSIC_LIBRARY_LAN_ENABLED: ${MUSIC_LIBRARY_LAN_ENABLED:-false}
  MUSIC_LIBRARY_LOCAL_PROXY_ENABLED: ${MUSIC_LIBRARY_LOCAL_PROXY_ENABLED:-true}
  MUSIC_LIBRARY_ADMIN_TOKEN: ${MUSIC_LIBRARY_ADMIN_TOKEN:-}
  MUSIC_LIBRARY_TRUSTED_HOSTS: ${MUSIC_LIBRARY_TRUSTED_HOSTS:-localhost,127.0.0.1,::1}
  MUSIC_LIBRARY_ALLOWED_ORIGINS: ${MUSIC_LIBRARY_ALLOWED_ORIGINS:-}
  LASTFM_API_URL: ${LASTFM_API_URL:-https://ws.audioscrobbler.com/2.0/}
  LASTFM_AUTH_URL: ${LASTFM_AUTH_URL:-https://www.last.fm/api/auth/}
  LRCLIB_API_URL: ${LRCLIB_API_URL:-https://lrclib.net/api}
  MUSICBRAINZ_API_URL: ${MUSICBRAINZ_API_URL:-https://musicbrainz.org/ws/2}
  MUSICBRAINZ_WEB_URL: ${MUSICBRAINZ_WEB_URL:-https://musicbrainz.org}

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile.packaged
  environment: *backend-environment
  volumes:
    - backend-storage:/app/storage
    - type: bind
      source: ${MUSIC_LIBRARY_ROOT_1:-./packaged/music-root-1}
      target: /music/root-1
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_library}
      POSTGRES_USER: ${POSTGRES_USER:-music_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_library}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18-packaged-cluster-data:/var/lib/postgresql

  migrate:
    <<: *backend-image
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  backend:
    <<: *backend-image
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 12

  queue:
    <<: *backend-image
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0", "--memory=512", "--sleep=1"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-image
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.packaged
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres18-packaged-cluster-data:
  backend-storage:
